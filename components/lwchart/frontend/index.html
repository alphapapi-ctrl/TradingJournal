<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", system-ui, sans-serif;
      user-select: none;
    }
    #toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      font-size: 12px;
    }
    #toolbar .spacer { flex: 1; }
    #toolbar button {
      background: var(--btn-bg, #1e222d);
      color: var(--btn-fg, #d1d4dc);
      border: 1px solid var(--btn-border, #363a45);
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
      line-height: 1.3;
    }
    #toolbar button:hover { filter: brightness(1.25); }
    #toolbar button.active {
      background: var(--btn-active-bg, #2962ff);
      color: #fff;
      border-color: var(--btn-active-bg, #2962ff);
    }
    #toolbar .group { display: flex; gap: 2px; }
    #toolbar .label { color: var(--btn-fg, #868b98); padding: 0 4px; }
    #chart { position: relative; }
    #legend {
      position: absolute;
      top: 6px;
      left: 8px;
      z-index: 10;
      font-size: 12px;
      font-family: "JetBrains Mono", Consolas, monospace;
      color: var(--btn-fg, #d1d4dc);
      pointer-events: none;
      white-space: pre;
    }
    #poslegend {
      position: absolute;
      top: 24px;
      left: 8px;
      z-index: 10;
      font-size: 12px;
      font-weight: 600;
      font-family: "JetBrains Mono", Consolas, monospace;
      pointer-events: none;
      white-space: pre;
    }
    #replay-controls { display: none; }
    body.replay #replay-controls { display: flex; }
  </style>
</head>
<body>
  <div id="toolbar">
    <div class="group" id="tf-group">
      <button data-tf="1" class="tf-btn">1m</button>
      <button data-tf="5" class="tf-btn">5m</button>
      <button data-tf="15" class="tf-btn">15m</button>
    </div>
    <div class="group" id="replay-controls">
      <span class="label">│</span>
      <button id="btn-play" title="Play/Pause">▶</button>
      <button id="btn-slower" title="Slower">−</button>
      <span class="label" id="speed-label">1x</span>
      <button id="btn-faster" title="Faster">+</button>
      <button id="btn-step" title="Step one bar">⏭ bar</button>
      <button id="btn-skip-session" title="Skip to session end">session ⇥</button>
      <button id="btn-skip-day" title="Skip to day end">day ⇥</button>
    </div>
    <div class="spacer"></div>
    <button id="btn-shot" title="Screenshot">📷</button>
  </div>
  <div id="chart"><div id="legend"></div><div id="poslegend"></div></div>

  <script src="streamlit-component-lib.js"></script>
  <script src="lightweight-charts.standalone.production.js"></script>
  <script src="chart_app.js"></script>
</body>
</html>
